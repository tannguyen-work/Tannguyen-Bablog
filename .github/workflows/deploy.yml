name: Deploy to Cloudflare Pages

# Tự động chạy khi push lên nhánh main (hoặc bấm tay trong tab Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build web tĩnh
        run: npm run build

      - name: Deploy lên Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1792aead81cc27f5246acedca6d0a330
          command: pages deploy out --project-name=tannguyen-bablog --commit-dirty=true
